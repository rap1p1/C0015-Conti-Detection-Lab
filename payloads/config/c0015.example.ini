; ============================================================
; c0015 lab config — EXAMPLE. Copy to C:\Users\Public\C0015\config.ini
; on the target before the run; fill placeholders per run.
; NOTHING in the payload code hardcodes lab values; every value
; used by the chain is read from this file or generated at runtime.
; NEVER put passwords/secrets here (accounts use run-as prompts).
; ============================================================

[lab]
run_id=RUN-YYYYMMDD-01
scenario_id=C0015-LAB-1

[bootstrap]
; entry macro reads these two keys from this file (no hardcode in code)
hta_path=C:\Users\Public\C0015\bootstrap.hta
mshta_path=C:\Windows\System32\mshta.exe
; HTTP server serving the masqueraded benign DLL (T1105 / T1036)
http_host=<KALI_OR_SERVE_HOST>
http_port=8000
dll_name=c0015-comparefor.jpg
dll_local_dir=C:\Users\Public\C0015
marker_name=dll-executed.txt
b64_marker_name=b64-marker.txt
b64_value=YzAwMTUgbGFiIGJlbmlnbg==
; proxy-execution tool (T1218.010) — OS path constant, override only if needed
regsvr32_path=C:\Windows\System32\regsvr32.exe

[c2sim]
c2_url=http://<C2_HOST>:8080
stage=phase3
host_alias=WS01
; session token comes from env C0015_SESSION_TOKEN (generated per run),
; format S1-<16 hex> — never stored in config
token_env=C0015_SESSION_TOKEN

[beacon]
loop_count=3
loop_sleep_sec=2
result_cap_bytes=1024
public_ip_check_url=http://<C2_HOST>:8001/myip
public_ip_check_enabled=1
; command the bootstrap DLL launches for the session-1 handoff (S2->S3)
beacon_cmd=powershell.exe -NoProfile -ExecutionPolicy Bypass -File C:\Users\Public\C0015\c0015_beacon.ps1 -Config C:\Users\Public\C0015\config.ini
; allowlisted task -> benign command mapping (no arbitrary commands)
task_T-DISCOVER-CORPUS=cmd.exe /c net view /all
task_T-BEACON-SLEEP=ping -n 2 127.0.0.1
task_T-NOOP=cmd.exe /c ver

[impact]
; manifest json (generated per run) defines corpus_root/backup/caps —
; the impact payload accepts ONLY the manifest path, no hardcoded roots
manifest_path=<PATH_TO_IMPACT_MANIFEST_JSON>
