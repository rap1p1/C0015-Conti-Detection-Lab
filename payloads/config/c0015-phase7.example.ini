; ============================================================
; c0015 phase-2 phase7 config — EXAMPLE for the 143 surrogate (S8/S9).
; Lives on FS01 at C:\C0015\config-phase7.ini (staged during S8a).
; NO secrets: session token is runtime-generated by the beacon.
; Values are per-run: copy and fill before the run.
; ============================================================

[lab]
run_id=RUN-YYYYMMDD-NN
scenario_id=C0015-LAB-1

[c2sim]
c2_url=http://192.168.50.1:8080
stage=phase7-session2
host_alias=FS01
token_env=C0015_SESSION_TOKEN

[beacon]
loop_count=2
loop_sleep_sec=2
result_cap_bytes=1024
; the payload DLL reads this exact key and spawns it (parent = rundll32)
beacon_cmd=powershell.exe -NoProfile -ExecutionPolicy Bypass -File C:\C0015\c0015_beacon.ps1 -Config C:\C0015\config-phase7.ini
task_T-DISCOVER-CORPUS=cmd.exe /c net view /all
task_T-BEACON-SLEEP=ping -n 2 127.0.0.1
task_T-NOOP=cmd.exe /c ver

[bootstrap]
marker_name=c0015_143-executed.txt